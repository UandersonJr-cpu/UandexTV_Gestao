{% extends "base.html" %}
{% block title %}Alterar senha | Uandex TV{% endblock %}
{% block page_title %}Segurança da conta{% endblock %}
{% block content %}
<div class="form-panel narrow"><div class="panel-head"><div><h3>Alterar senha</h3><p class="muted">Use uma senha forte e exclusiva para proteger seus dados.</p></div></div>
<form method="post" class="form-grid one-col">
<div class="field"><label>Senha atual</label><input name="current_password" type="password" required autocomplete="current-password"></div>
<div class="field"><label>Nova senha (mínimo 10 caracteres)</label><input name="new_password" type="password" required minlength="10" autocomplete="new-password"></div>
<div class="field"><label>Confirmar nova senha</label><input name="confirm_password" type="password" required minlength="10" autocomplete="new-password"></div>
<div class="field"><button class="btn primary">Atualizar senha</button></div>
</form></div>
{% endblock %}
